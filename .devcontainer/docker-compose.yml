services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-24-bookworm
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    init: true
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
